<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Website Redirect</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:Arial;background:linear-gradient(135deg,#111827,#2563eb);color:white}
.container{width:min(92%,560px);padding:40px;text-align:center;background:#ffffff20;border-radius:20px;backdrop-filter:blur(10px)}
.input-row{display:flex;gap:8px;margin-top:20px}select,input,button{padding:14px;border:0;border-radius:10px;font-size:16px}select{width:120px}input{flex:1}button{width:100%;margin-top:15px;cursor:pointer;font-weight:bold;color:#2563eb;background:white}#short{margin-top:20px;word-break:break-all}#qrcode{margin:25px auto;background:white;padding:10px;width:max-content;border-radius:10px}
</style>
</head>
<body>
<div class="container">
<h1>Website Redirect</h1>
<p>Redirect, QR Code and Short Link</p>
<div class="input-row">
<select id="protocol"><option value="https://" selected>https://</option><option value="http://">http://</option></select>
<input id="url" placeholder="example.com">
</div>
<button onclick="go()">Go</button>
<button onclick="makeQR(currentUrl())">Generate QR Code</button>
<button onclick="createShortLink()">Generate Short Link</button>
<div id="short"></div>
<div id="qrcode"></div>
</div>
<script>
const API_ENDPOINT='https://s.presikid.com';
let lastShort='';
function currentUrl(){let v=document.getElementById('url').value.trim();v=v.replace(/^(https?:\/\/|https?:|http:)/i,'');return document.getElementById('protocol').value+v}
function go(){window.location.href=currentUrl()}
function makeQR(u){let q=document.getElementById('qrcode');q.innerHTML='';new QRCode(q,{text:u,width:220,height:220})}
async function createShortLink(){
 let r=await fetch(API_ENDPOINT+'/create',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url:currentUrl()})});
 let d=await r.json();lastShort=d.url;
 document.getElementById('short').innerHTML='Short Link:<br>'+d.url+'<br><button onclick="copyShort()">Copy</button><button onclick="makeQR(lastShort)">QR Code</button>';
}
function copyShort(){navigator.clipboard.writeText(lastShort)}
document.getElementById('url').addEventListener('keydown',e=>{if(e.key==='Enter')go()});
</script>
</body>
</html>
