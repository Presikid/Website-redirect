<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Website Redirect</title><script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script><style>body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:Arial;background:linear-gradient(135deg,#111827,#2563eb);color:white}.container{width:min(92%,560px);padding:40px;text-align:center;background:#ffffff20;border-radius:20px;backdrop-filter:blur(10px)}.row{display:flex;gap:8px;margin-top:20px}select,input,button{padding:14px;border:0;border-radius:10px;font-size:16px}select{width:150px}input{flex:1}button{width:100%;margin-top:15px;cursor:pointer;font-weight:bold;color:#2563eb;background:white}.box{margin-top:20px;padding:15px;background:#ffffff15;border-radius:10px;text-align:left;word-break:break-all}.section{margin-top:35px;border-top:1px solid #ffffff40;padding-top:25px}#qrcode{margin:25px auto;background:white;padding:10px;width:max-content;border-radius:10px}</style></head><body><div class="container"><h1>Website Redirect</h1><p>Redirect, QR Code and Short Link</p><div class="row"><select id="protocol"><option value="https://" selected>https://</option><option value="http://">http://</option></select><input id="url" placeholder="example.com"></div><button onclick="go()">Go</button><button onclick="makeQR(currentUrl())">Generate QR Code</button><div class="row"><select id="expire"><option value="permanent">Permanent</option><option value="m1">1 minute</option><option value="m5">5 minutes</option><option value="m10">10 minutes</option><option value="h1">1 hour</option><option value="h5">5 hours</option><option value="d1">1 day</option><option value="w1">1 week</option><option value="mo1">1 month</option><option value="y1">1 year</option></select></div><button onclick="createShortLink()">Generate Short Link</button><div id="short" class="box"></div><div id="qrcode"></div><div class="section"><h2>Short Link Query</h2><input id="code" placeholder="Short code or URL"><button onclick="queryInfo()">Query Information</button><div id="info" class="box"></div></div></div><script>const API_ENDPOINT='https://s.presikid.com';let lastShort='';function currentUrl(){let v=document.getElementById('url').value.trim().replace(/^(https?:\/\/|https?:|http:)/i,'');return document.getElementById('protocol').value+v}function go(){location.href=currentUrl()}function makeQR(u){let q=document.getElementById('qrcode');q.innerHTML='';new QRCode(q,{text:u,width:220,height:220})}async function createShortLink(){let r=await fetch(API_ENDPOINT+'/create',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url:currentUrl(),duration:document.getElementById('expire').value})});let d=await r.json();lastShort=d.url;document.getElementById('short').innerHTML='Short Link:<br>'+d.url+(d.expires_at?'<br>Expires: '+d.expires_at:'<br>Expires: Never')+'<br><button onclick="navigator.clipboard.writeText(lastShort)">Copy</button><button onclick="makeQR(lastShort)">QR Code</button>'}async function queryInfo(){let c=document.getElementById('code').value.trim().replace('https://s.presikid.com/','');let r=await fetch(API_ENDPOINT+'/info/'+c);let d=await r.json();document.getElementById('info').innerHTML='Code: '+d.code+'<br>Target: '+d.target_url+'<br>Created: '+d.created_at+'<br>Expires: '+(d.expires_at||'Never')+'<br>Visits: '+d.visits}document.getElementById('url').addEventListener('keydown',e=>{if(e.key==='Enter')go()});</script></body></html>
